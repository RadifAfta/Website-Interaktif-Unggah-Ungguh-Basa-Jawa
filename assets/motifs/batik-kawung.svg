<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Pola Batik Kawung Geometris Elegan -->
  <defs>
    <style>
      .petal { fill: #4A2E18; fill-opacity: 0.05; stroke: #8C6226; stroke-opacity: 0.18; stroke-width: 1.2; }
      .core { fill: #D4A343; fill-opacity: 0.25; }
      .cross { stroke: #8C6226; stroke-opacity: 0.15; stroke-width: 1; }
    </style>
  </defs>

  <!-- Garis Kisi Tipis -->
  <line x1="0" y1="40" x2="80" y2="40" class="cross"/>
  <line x1="40" y1="0" x2="40" y2="80" class="cross"/>

  <!-- Kelopak Kawung Pusat (40, 40) -->
  <ellipse cx="40" cy="22" rx="10" ry="17" class="petal"/>
  <ellipse cx="40" cy="58" rx="10" ry="17" class="petal"/>
  <ellipse cx="22" cy="40" rx="17" ry="10" class="petal"/>
  <ellipse cx="58" cy="40" rx="17" ry="10" class="petal"/>
  <circle cx="40" cy="40" r="4" class="core"/>

  <!-- Kelopak Pojok Sudut -->
  <ellipse cx="0" cy="0" rx="14" ry="14" class="petal"/>
  <ellipse cx="80" cy="0" rx="14" ry="14" class="petal"/>
  <ellipse cx="0" cy="80" rx="14" ry="14" class="petal"/>
  <ellipse cx="80" cy="80" rx="14" ry="14" class="petal"/>
  <circle cx="0" cy="0" r="3" class="core"/>
  <circle cx="80" cy="0" r="3" class="core"/>
  <circle cx="0" cy="80" r="3" class="core"/>
  <circle cx="80" cy="80" r="3" class="core"/>
</svg>
